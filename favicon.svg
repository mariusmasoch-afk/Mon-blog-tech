<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="8.5" fill="url(#g)"/>
  <!-- Ligne d'horizon -->
  <line x1="4" y1="30" x2="36" y2="30" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
  <!-- Demi-cercle plein -->
  <path d="M11,30 A9,9 0 0,1 29,30 Z" fill="white"/>
  <!-- Rayon central -->
  <line x1="20" y1="21" x2="20" y2="13" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Rayon +30° -->
  <line x1="24.5" y1="22.2" x2="28" y2="16.1" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Rayon -30° -->
  <line x1="15.5" y1="22.2" x2="12" y2="16.1" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Rayon +60° -->
  <line x1="27.8" y1="25.5" x2="33.9" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
  <!-- Rayon -60° -->
  <line x1="12.2" y1="25.5" x2="6.1" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
</svg>
